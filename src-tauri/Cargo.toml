[package]
name = "chukcut"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chukcut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.104"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
parking_lot = "0.12.5"
rayon = "1.12.0"
glam = "0.33.2"
image = "0.25.10"
# `media/thumbnails.rs` still uses this; the preview does not. It was replaced
# there because it needed ~63 ms for a 1080x1920 frame against a 33 ms budget.
jpeg-encoder = "0.7.0"
# libjpeg-turbo, for the preview's software JPEG path — 3-4x faster than
# `jpeg-encoder` on the same frame because it is SIMD rather than portable
# Rust. Built from source by `turbojpeg-sys` (cmake + nasm) since Ubuntu ships
# the runtime without a pkg-config file; that costs about a minute, once.
turbojpeg = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ffmpeg-next = "6.1"
# Output device only. cpal is the one crate that is a thin, unopinionated
# wrapper over the platform APIs (ALSA here) without dragging in a mixer,
# a decoder or an event loop of its own — we have all three already. 0.18
# rather than the older 0.15 because its `Stream` is `Send + Sync`, which is
# what lets the device live in Tauri-managed state next to the preview server.
cpal = "0.18"
wgpu = "30.0.0"
bytemuck = "1.25.2"
futures = "0.3.33"
pollster = "1.0.1"
tauri-plugin-dialog = "2.7.2"

# The escape hatch under wgpu, for the one thing WebGPU has no concept of:
# allocating a buffer whose memory can be exported as a DMA-BUF file descriptor,
# so the VAAPI encoder can read what the compositor wrote instead of being handed
# a copy. See `docs/research/zero-copy-encode.md` and `modules/render/dmabuf.rs`.
#
# Both are pinned to exactly what wgpu 30 links, and `cargo tree` should be
# checked after any wgpu bump: a *second* `ash` in the graph would compile and
# would hand us entry points for a different `VkDevice`, which is a class of bug
# that shows up as a driver crash rather than a type error. Linux only — DMA-BUF
# is a DRM concept and nothing here is reachable on another platform.
[target.'cfg(target_os = "linux")'.dependencies]
wgpu-hal = { version = "30.0.0", features = ["vulkan"] }
ash = "0.38"
libc = "0.2"


# Development builds run the full pipeline — decode, JPEG encode, pixel work —
# at video rates, and an unoptimized build of that is not merely slower, it is
# unusable: `jpeg-encoder` needs ~130 ms per preview frame at opt-level 0 and
# ~8 ms at 3, which is the difference between 5 fps and real-time playback.
#
# Dependencies are optimized fully because they are compiled once and rarely
# change. Our own crate stays at opt-level 1, which keeps incremental rebuilds
# quick while removing the worst of the debug overhead.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
