name: Feature request
description: Something the editor should be able to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check [`docs/ROADMAP.md`](../blob/master/docs/ROADMAP.md) first — it may
        already be planned, in which case say so on the existing issue instead.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The editing task, not the feature. "Cut on the beat" tells us more than
        "add markers", and sometimes the answer is a different feature.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true

  - type: textarea
    id: prior-art
    attributes:
      label: How other editors do it
      description: CapCut, Resolve, Premiere, Kdenlive — what works and what does not.
