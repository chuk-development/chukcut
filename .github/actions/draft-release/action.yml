# Adapted from storytold/craft-common-actions (actions/draft-release) for the
# FilmCraft release pipeline, deliberately taken over and credited in
# NOTICE.md and docs/decisions/0037-release-workflow-from-filmcraft.md.
# Same behaviour: every release-* artifact into one directory, one
# SHA256SUMS.txt over all of them, a DRAFT release v<version> with GitHub's
# generated notes, an existing draft emptied and refilled, a published release
# never touched. Changes: chukcut's own lines go in front of the generated
# notes, an empty artifact set is an error, and the inputs reach the shell
# through the environment.
name: "Draft GitHub release"
description: "Collect the release artifacts, write SHA256SUMS.txt, create or update a draft release"

inputs:
  version:
    description: "Release version without a leading v"
    required: true
  prerelease:
    description: "Mark the release as a pre-release"
    required: false
    default: "false"
  notes:
    description: "Text put in front of GitHub's generated release notes"
    required: false
    default: ""
  github-token:
    description: "Token with contents: write"
    required: true

runs:
  using: "composite"
  steps:
    - name: Download all release artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: release-*
        path: artifacts
        merge-multiple: true

    - name: Compute checksums
      shell: bash
      run: |
        mkdir -p artifacts
        cd artifacts || exit 1
        shopt -s nullglob
        files=(*)
        if [ ${#files[@]} -eq 0 ]; then
          echo "::error::no job produced anything to release"
          exit 1
        fi
        sha256sum -- "${files[@]}" | tee SHA256SUMS.txt

    - name: Create or update the draft release
      shell: bash
      working-directory: artifacts
      env:
        VERSION: ${{ inputs.version }}
        PRERELEASE: ${{ inputs.prerelease }}
        NOTES: ${{ inputs.notes }}
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
      run: |
        tag="v$VERSION"
        title="chukcut $VERSION"
        pre=()
        if [ "$PRERELEASE" = true ]; then pre=(--prerelease); fi
        if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
          if [ "$draft" != true ]; then
            echo "::error::release $tag is published already; not touching it. Bump the version (packaging/set-version.sh)."
            exit 1
          fi
          echo "Updating draft $tag: replacing its assets"
          gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
            gh release delete-asset "$tag" "$asset" --yes
          done
          gh release edit "$tag" --draft --title "$title" --target "$GITHUB_SHA" --prerelease="$PRERELEASE"
          gh release upload "$tag" --clobber -- *
        else
          echo "Creating draft $tag"
          # A draft has no tag yet: GitHub creates v<version> at --target when
          # someone presses Publish. --notes goes in front of the generated notes.
          gh release create "$tag" --draft --title "$title" --target "$GITHUB_SHA" \
            --notes "$NOTES" --generate-notes "${pre[@]}" -- *
        fi
        {
          echo "Draft release **$title** at \`${GITHUB_SHA::9}\`:"
          echo
          sed 's/^/    /' SHA256SUMS.txt
        } >>"$GITHUB_STEP_SUMMARY"
