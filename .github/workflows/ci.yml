name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A run takes over 20 minutes and master is pushed more often than that;
  # cancelling there meant no master run ever finished. Pull requests still
  # cancel superseded runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Three jobs run in parallel, so the wall-clock time is the slowest one (the
# tests), not the sum:
#
#   packaging  validates the desktop files and the shell scripts (seconds)
#   test       fmt, clippy, the engine tests on lavapipe, the app, CLI and
#              ML worker tests (debug)
#   release    the release build users get, packed as a tarball artifact
#
# The system packages are one list, in one place: .github/apt-packages.txt.

jobs:
  packaging:
    name: Packaging files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            desktop-file-utils appstream libxml2-utils shellcheck
      - name: Desktop entry
        run: desktop-file-validate packaging/linux/chukcut.desktop
      - name: AppStream metadata
        run: appstreamcli validate --no-net packaging/linux/io.github.chuk_development.chukcut.metainfo.xml
      - name: MIME type
        run: xmllint --noout packaging/linux/chukcut-mime.xml
      - name: Shell scripts
        run: shellcheck scripts/*.sh packaging/*.sh packaging/linux/*.sh

  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The debug test build of the whole workspace (wgpu, GPUI, whisper.cpp,
      # fourteen engine integration-test binaries) needs more room than the
      # runner leaves free. The Android SDK and .NET are the two largest
      # things on the image that this job never uses.
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      # The build set, plus what only the tests use: Mesa's software Vulkan
      # driver (lavapipe) for the GPU tests, and the ffmpeg CLI that generates
      # the engine's and the CLI's test media. Without ffmpeg those tests skip.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y $(grep -v '^#' .github/apt-packages.txt) \
            mesa-vulkan-drivers ffmpeg

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug

      - name: Formatting
        run: cargo fmt --all --check

      # Fatal: the backlog is cleared, so any warning is new. Fix it, or
      # allow that one lint on that one item with a comment saying why.
      # The toolchain is `stable`, so a Rust release can bring a new lint
      # that turns this red without a change here.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -j 2 -- -D warnings

      # The runner has no GPU, so the GPU tests run on lavapipe, Mesa's
      # software Vulkan driver: the second of the two adapters
      # scripts/gpu-tests.sh checks on developer machines. VK_ICD_FILENAMES
      # pins the driver, and CHUKCUT_TEST_ADAPTER makes a library test that
      # got any other adapter fail instead of passing on the wrong one
      # (render::test_context). There is no VAAPI or NVDEC device, so the
      # hardware decode and encode paths skip or fall back to software;
      # tests/every_card.rs is the acceptance test for them, on real cards.
      #
      # `-j 2` limits parallel rustc jobs: linking the integration-test
      # binaries in parallel is what runs a 16 GB runner out of memory.
      - name: Engine tests (lavapipe)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          CHUKCUT_TEST_ADAPTER: llvmpipe
        run: cargo test -p chukcut-engine -j 2

      - name: App tests
        run: cargo test -p chukcut -j 2

      # The real chukcut-cli binary against generated media, the MCP server,
      # and tests/reachability.rs: every engine command is reachable from
      # the CLI or allowlisted with a reason.
      - name: CLI tests
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: cargo test -p chukcut-cli -j 2

      # The protocol, the model registry and the pre- and post-processing.
      # Nothing here loads ONNX Runtime, so no model or GPU is needed.
      - name: ML worker tests
        run: cargo test -p chukcut-ml-worker -j 2

  release:
    name: Release build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y $(grep -v '^#' .github/apt-packages.txt)

      - uses: dtolnay/rust-toolchain@stable

      # A cache of its own: the release profile (thin LTO) shares no
      # artifacts with the debug build in the test job.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Build
        run: cargo build --release --locked -p chukcut -p chukcut-ml-worker -p chukcut-cli

      - name: Size
        run: ls -l target/release/chukcut target/release/chukcut-ml-worker target/release/chukcut-cli

      - name: Tarball
        run: packaging/tarball.sh --no-build

      # The editor finds the worker next to itself: all three must ship in bin/.
      - name: Tarball contents
        run: |
          listing="$(tar -tJf target/dist/chukcut-*.tar.xz)"
          for name in chukcut chukcut-ml-worker chukcut-cli; do
            echo "$listing" | grep -qx "chukcut-[^/]*/bin/$name" || { echo "missing bin/$name"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: chukcut-x86_64-linux
          path: target/dist/*
          retention-days: 7
