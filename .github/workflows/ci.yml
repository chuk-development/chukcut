name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # FFmpeg's headers, VAAPI, ALSA for cpal, the X11/Wayland/xkb/fontconfig
      # headers gpui's Linux platform links, and libshaderc —
      # without the last one shaderc-sys builds glslang from source with CMake,
      # which works but adds several minutes to a cold build.
      #
      # nasm and cmake are for turbojpeg-sys, which builds libjpeg-turbo from
      # source with REQUIRE_SIMD=ON and fails at "Didn't find assembler"
      # otherwise. Ubuntu's libjpeg-turbo is too old to link against instead.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev \
            libva-dev libasound2-dev libshaderc-dev nasm cmake

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      # Reported, not fatal. There is a backlog of about 28 style lints — no
      # correctness among them — and failing the build on it would only teach
      # people to ignore a red tick. Clear the backlog, then add `-D warnings`.
      - name: Clippy
        run: cargo clippy --all-targets

      # Tests that need a GPU adapter or FFmpeg binaries skip with a printed
      # reason rather than fail, so a runner without either still reports
      # truthfully — it just runs fewer tests. See crates/engine/tests/support.
      - name: Tests
        run: cargo test -j 4
