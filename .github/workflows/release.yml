# Adapted from storytold/craft-common-actions (.github/workflows/release.yml,
# the shared release workflow of the Craft apps) and storytold/filmcraft
# (.github/workflows/release.yml, packaging/linux/package.sh), Apache-2.0.
# FilmCraft's release pipeline does this better than ours did, so we took it
# over on purpose and say so: NOTICE.md, README.md (Credits) and
# docs/decisions/0037-release-workflow-from-filmcraft.md, which also lists
# what we changed and what we left out on purpose (the craft-fonts embedding
# above all). FilmCraft is MIT OR Apache-2.0, used here under Apache-2.0; a
# copy of that licence is in .github/LICENSE-APACHE-2.0.txt.
# craft-common-actions has no licence file, so its workflow was rewritten for
# chukcut from its structure, not pasted (decision 0037).
#
# chukcut cannot call their shared workflow: it belongs to another
# organisation and is tuned for their crates (cargo xtask, nfpm, WiX,
# craft-fonts). This file is the same pipeline rebuilt around chukcut's own
# packaging scripts, which bundle FFmpeg into the AppImage.
#
# How a release happens:
#
#   1. packaging/set-version.sh 0.2.0, commit, push to master as usual.
#   2. Push that commit to the `release` branch:
#        git push origin master:release
#   3. The workflow builds everything, tests the Linux packages, and leaves a
#      DRAFT release v0.2.0 with every file, SHA256SUMS.txt and GitHub's
#      generated notes. Someone reads it and presses Publish; that creates the
#      tag. Nothing here publishes or pushes a tag.
#
# A test run: Actions > Release > Run workflow, optionally with a version
# override (0.2.0-rc.1), and "draft release" only if you want a draft.
#
# Linux is the product: both Linux jobs must pass, or there is no draft.
# macOS and Windows are experimental (continue-on-error, CLAUDE.md): the
# engine does not compile there yet (docs/decisions/0033-release-builds.md),
# and their jobs stay so they build as soon as the code allows.
#
# Release file names, one scheme for everything (FilmCraft's):
#   chukcut-<version>-linux-<arch>.AppImage (+ .zsync)   x86_64, aarch64
#   chukcut-<version>-linux-<arch>.deb                   Ubuntu 24.04 family
#   chukcut-<version>-linux-<arch>.tar.xz                Ubuntu 24.04 family
#   chukcut-<version>-macos-universal.dmg                experimental
#   chukcut-<version>-windows-x86_64.zip / -setup.exe    experimental
#   SHA256SUMS.txt                                       all of the above
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: crates/app/Cargo.toml)"
        type: string
        default: ""
      macos:
        description: "macOS universal .dmg (experimental)"
        type: boolean
        default: true
      windows:
        description: "Windows .zip and installer (experimental)"
        type: boolean
        default: true
      draft_release:
        description: "Leave a DRAFT release v<version> (a push to the release branch always does)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A run that will leave a draft fails here, in seconds, when the
      # version is a published release already, not after the builds.
      - id: v
        uses: ./.github/actions/resolve-version
        with:
          input-version: ${{ inputs.version }}
          check-published: ${{ github.event_name == 'push' || inputs.draft_release }}
          github-token: ${{ github.token }}

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The build set from .github/apt-packages.txt (FFmpeg headers, libva,
      # shaderc, the GPUI libraries, ...), dpkg-dev for the .deb, zsync for
      # the AppImage's .zsync, and what the smoke tests run on: a virtual X
      # server and Mesa's software Vulkan driver (lavapipe).
      - name: System dependencies
        run: |
          sudo apt-get update
          # One package per word: the split is the point.
          # shellcheck disable=SC2046
          sudo apt-get install --no-install-recommends -y $(grep -v '^#' .github/apt-packages.txt) \
            dpkg-dev zsync xvfb xauth mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.arch }}

      # The binaries report the version the files are named after.
      - name: Apply version override
        if: inputs.version != ''
        run: packaging/set-version.sh "$VERSION"

      - name: Build
        run: cargo build --release --locked -p chukcut -p chukcut-ml-worker -p chukcut-cli

      - name: .deb
        run: packaging/deb/build-deb.sh --no-build --version "$VERSION"

      # Install it the way a user does: apt resolves the Depends line that
      # dpkg-shlibdeps wrote. The CLI must start, and the worker must be
      # found in /usr/libexec/chukcut, where the editor looks for it.
      - name: .deb smoke test
        run: |
          dpkg-deb --info target/dist/chukcut_*.deb
          dpkg-deb --contents target/dist/chukcut_*.deb
          sudo apt-get install -y ./target/dist/chukcut_*.deb
          chukcut-cli --version
          test -x /usr/libexec/chukcut/chukcut-ml-worker
          status="$(chukcut-cli ml status)"
          echo "$status"
          if grep -q 'chukcut-ml-worker is not installed' <<<"$status"; then
            echo "::error::the CLI did not find the ML worker"
            exit 1
          fi
          sudo apt-get remove -y chukcut

      - name: AppImage
        run: packaging/appimage/build-appimage.sh --no-build --version "$VERSION"

      # The runner has no FUSE, so the AppImage unpacks itself and runs. The
      # editor runs for ten seconds on a virtual display with lavapipe:
      # still running at the timeout (exit 124) means it started. The update
      # information must be in the file and the .zsync next to it, or
      # AppImageUpdate has nothing to work with.
      - name: AppImage smoke test
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          appimage="target/dist/chukcut-$VERSION-linux-$ARCH.AppImage"
          test -s "$appimage.zsync" || { echo "::error::no $appimage.zsync"; exit 1; }
          "$appimage" --appimage-updateinformation | grep -q "^gh-releases-zsync|" \
            || { echo "::error::no update information in the AppImage"; exit 1; }
          "$appimage" --appimage-extract-and-run --cli --version
          status="$("$appimage" --appimage-extract-and-run --cli ml status)"
          echo "$status"
          if grep -q 'chukcut-ml-worker is not installed' <<<"$status"; then
            echo "::error::the CLI did not find the ML worker inside the AppImage"
            exit 1
          fi
          set +e
          xvfb-run -a timeout 10 "$appimage" --appimage-extract-and-run
          status=$?
          set -e
          if [ "$status" != 124 ]; then
            echo "::error::the editor exited with $status within 10 s"
            exit 1
          fi

      - name: Tarball
        run: packaging/tarball.sh --no-build --version "$VERSION"

      # One naming scheme for every release file. The AppImage already has
      # its final name: the .zsync refers to it by name.
      - name: Release files
        run: |
          mkdir -p dist/release
          base="chukcut-$VERSION-linux-$ARCH"
          deb=(target/dist/chukcut_*.deb)
          cp "${deb[0]}" "dist/release/$base.deb"
          cp "target/dist/$base.AppImage" "target/dist/$base.AppImage.zsync" dist/release/
          cp "target/dist/chukcut-$VERSION-$ARCH-linux.tar.xz" "dist/release/$base.tar.xz"
          ls -l dist/release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  # EXPERIMENTAL. One native build per architecture, each with Homebrew's
  # FFmpeg bundled into the .app by dylibbundler; macos-universal joins them
  # with lipo. Homebrew bottles are per architecture, so a single cross build
  # could not link both. Signed ad hoc only: notarisation (FilmCraft's
  # import-cert/notarytool steps) needs an Apple Developer ID.
  macos:
    name: macOS ${{ matrix.arch }} (experimental)
    needs: version
    if: github.event_name == 'push' || inputs.macos
    continue-on-error: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }
          - { arch: x86_64, runner: macos-15-intel }
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Homebrew dependencies
        run: |
          brew install ffmpeg dylibbundler nasm pkgconf shaderc
          echo "SHADERC_LIB_DIR=$(brew --prefix shaderc)/lib" >>"$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-macos-${{ matrix.arch }}

      # BSD sed on macOS: the script's `sed -i` needs GNU sed.
      - name: Apply version override
        if: inputs.version != ''
        run: |
          brew install gnu-sed
          PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH" packaging/set-version.sh "$VERSION"

      - name: Build
        run: cargo build --release --locked -p chukcut -p chukcut-ml-worker -p chukcut-cli

      - name: App bundle
        run: packaging/macos/build-app.sh --no-build --version "$VERSION"

      # Not release-*: these are the input of macos-universal, not release files.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-app-${{ matrix.arch }}
          path: target/dist/*.app.tar.gz
          if-no-files-found: error

  macos-universal:
    name: macOS universal .dmg (experimental)
    needs: [version, macos]
    if: github.event_name == 'push' || inputs.macos
    continue-on-error: true
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-app-*
          path: target/macos-in
          merge-multiple: true

      - name: Universal app and .dmg
        run: |
          packaging/macos/make-universal.sh "$VERSION" \
            target/macos-in/chukcut-*-arm64-macos.app.tar.gz \
            target/macos-in/chukcut-*-x86_64-macos.app.tar.gz
          mkdir -p dist/release
          cp "target/dist/chukcut-$VERSION-universal-macos.dmg" "dist/release/chukcut-$VERSION-macos-universal.dmg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-universal
          path: dist/release/*
          if-no-files-found: error

  # EXPERIMENTAL. MSVC build against BtbN's shared FFmpeg build (FFMPEG_DIR),
  # packed as a portable zip with the FFmpeg DLLs, and as an Inno Setup
  # installer from the same files. Unsigned: FilmCraft's Authenticode and
  # Azure Trusted Signing steps need a certificate we do not have.
  windows:
    name: Windows x86_64 (experimental)
    needs: version
    if: github.event_name == 'push' || inputs.windows
    continue-on-error: true
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # The FFmpeg 7.1 release branch, rebuilt daily by BtbN; GPL, shared
      # libraries, with headers and import libraries for MSVC.
      FFMPEG_ZIP: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: FFmpeg, NASM, libclang
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest -Uri $env:FFMPEG_ZIP -OutFile $zip
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          $ffmpeg = (Get-ChildItem $env:RUNNER_TEMP -Directory -Filter 'ffmpeg-n7.1*' | Select-Object -First 1).FullName
          "FFMPEG_DIR=$ffmpeg" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # FFmpeg's DLLs on PATH, so a build script or test that loads them finds them.
          "$ffmpeg\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          # bindgen (ffmpeg-sys-next, whisper-rs-sys) loads libclang from the image's LLVM.
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-windows

      - name: Apply version override
        if: inputs.version != ''
        shell: bash
        run: packaging/set-version.sh "$VERSION"

      - name: Build
        run: cargo build --release --locked -p chukcut -p chukcut-ml-worker -p chukcut-cli

      - name: Portable zip
        run: packaging/windows/package.ps1 -Version $env:VERSION -FfmpegDir $env:FFMPEG_DIR

      - name: Installer
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $stage = "target\windows\chukcut-$env:VERSION-x86_64-windows"
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\$stage" "/DOutputDir=$PWD\target\dist" packaging\windows\chukcut.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Release files
        run: |
          New-Item -ItemType Directory -Force dist\release | Out-Null
          Copy-Item "target\dist\chukcut-$env:VERSION-x86_64-windows.zip" "dist\release\chukcut-$env:VERSION-windows-x86_64.zip"
          Copy-Item "target\dist\chukcut-$env:VERSION-x86_64-windows-setup.exe" "dist\release\chukcut-$env:VERSION-windows-x86_64-setup.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x86_64
          path: dist/release/*
          if-no-files-found: error

  # A draft only: someone reads it and presses Publish. Needs both Linux
  # jobs; macOS and Windows files are attached when those jobs made them.
  release:
    name: Draft release
    needs: [version, linux, macos-universal, windows]
    if: >-
      !cancelled()
      && needs.version.result == 'success'
      && needs.linux.result == 'success'
      && (github.event_name == 'push' || inputs.draft_release)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions

      - uses: ./.github/actions/draft-release
        with:
          version: ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          github-token: ${{ github.token }}
          notes: |
            **Linux** (the product): the AppImage runs on any distribution with glibc 2.39 or newer and has FFmpeg inside; AppImageUpdate and Gear Lever update it through the `.zsync` next to it. The `.deb` and the `.tar.xz` use the system FFmpeg and are for Ubuntu 24.04, Mint 22 and their relatives.
            **macOS and Windows** files, when present, are experimental and unsigned.
            Check downloads against `SHA256SUMS.txt`. What each file contains: `packaging/README.md`.
