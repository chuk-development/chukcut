# Vendored from crates.io signalsmith-stretch 0.1.3
# (https://github.com/colinmarc/signalsmith-stretch-rs, MIT), which wraps
# Signalsmith Stretch and its signalsmith-linear headers (both MIT; licence
# files beside each part). Wired in through `[patch.crates-io]` in the
# workspace manifest, so the engine's dependency and the Rust API are
# unchanged.
#
# The one change: `src/wrapper.cpp` constructs every stretcher with a fixed
# seed instead of `std::random_device`. Above a 2x stretch the library
# randomises each bin's time factor from that engine, so pitch-preserving audio
# through a slow speed curve came out different on every render — and
# `audiofx::render` must be a pure function of its spec, because the preview
# plays a cached render and the export renders again. Test:
# `export::audio::tests::a_speed_curve_mixes_to_the_same_samples_every_time`.
#
# Left out: examples, dev-dependencies, the C++ CLI, the web build, the
# linear-algebra tests. To update: copy the new crate's build.rs, src/,
# signalsmith-stretch/signalsmith-stretch.h and signalsmith-linear/{fft,stft}.h
# over these, re-apply the seed, bump the version. If upstream exposes a seed,
# drop this copy and pass the seed from `audiofx/stretch.rs`.
[package]
edition = "2021"
name = "signalsmith-stretch"
version = "0.1.3"
authors = ["Colin Marc <hi@colinmarc.com>"]
build = "build.rs"
description = "A wrapper for the Signalsmith Stretch timestretch and pitch-shifting algorithm"
license = "MIT"
repository = "https://github.com/colinmarc/signalsmith-stretch-rs"
publish = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "signalsmith_stretch"
path = "src/lib.rs"

[dependencies]
dasp = "0.11"

[build-dependencies]
bindgen = "0.70"
cc = "1"
