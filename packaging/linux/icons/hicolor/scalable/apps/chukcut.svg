<?xml version="1.0" encoding="UTF-8"?>
<!-- The chukcut app icon: the logo glyph from crates/app/src/ui/icons.rs
     (a "c" opened by a cut, drawn on a 24 grid) in the design language's
     accent on a graphite tile. Regenerate the PNGs with
     packaging/linux/make-icons.sh after editing this file. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24262b"/>
      <stop offset="1" stop-color="#131417"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#tile)"/>
  <rect x="12.75" y="12.75" width="230.5" height="230.5" rx="55.25" fill="none" stroke="#33363d" stroke-width="1.5"/>
  <!-- The glyph's 24-unit grid scaled 8x and centred; the glyph's own
       bounding box is about (4.8, 4.8)-(20, 19.2), so its centre (12.4, 12)
       lands on the tile's centre. -->
  <g transform="translate(28.8 32) scale(8)" fill="none" stroke="#2fd5c8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.6 7.4A7.2 7.2 0 1 0 17.6 16.6"/>
    <path d="M13 13.5l7-7"/>
  </g>
</svg>
