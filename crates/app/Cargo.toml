[package]
name = "chukcut"
version = "0.1.0"
description = "A fast, modern video editor for Linux. Native GPU UI on the chukcut engine."
license = "GPL-3.0-or-later"
repository = "https://github.com/chuk-development/chukcut"
edition = "2021"
publish = false

[[bin]]
name = "chukcut"
path = "src/main.rs"

[dependencies]
# Offline transcription (whisper.cpp) is on in the app; `--features cuda`
# adds whisper.cpp's CUDA backend and needs `nvcc`.
chukcut-engine = { path = "../engine", features = ["local-whisper"] }

# GPUI (Zed's UI toolkit) plus GPUI Component's widgets, themes and the Lucide
# icon set, as one pinned bundle: `gpui-kit` re-exports the matching `gpui`
# build, so the widgets and the app always share one set of types.
gpui = { package = "gpui-kit", version = "0.7.0" }

# `RenderImage` is built from `image::Frame`, so this must be the same major
# version gpui links.
image = "0.25"
anyhow = "1"
parking_lot = "0.12"
tracing = "0.1"
serde_json = "1"
# The answer channel of the built-in file browser; the same crate GPUI's
# own file prompts answer on.
futures-channel = "0.3"

[features]
cuda = ["chukcut-engine/local-whisper-cuda"]
